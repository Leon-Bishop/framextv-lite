name: Build Android TV APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'downloads/**'
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android 35 SDK components
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          if ! command -v sdkmanager >/dev/null 2>&1; then
            export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${PATH}"
          fi
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compile installable debug APK
        run: gradle --no-daemon :app:assembleStandardDebug :app:assembleTv11Debug
      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrameXTV-Lite-APK
          path: app/build/outputs/apk/standard/debug/app-standard-debug.apk
          if-no-files-found: error
      - name: Save Android 11 variant artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrameXTV-Lite-TV11-APK
          path: app/build/outputs/apk/tv11/debug/app-tv11-debug.apk
          if-no-files-found: error
      - name: Publish APK for direct public download
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/standard/debug/app-standard-debug.apk downloads/framextv-lite.apk
          cp app/build/outputs/apk/tv11/debug/app-tv11-debug.apk downloads/framextv-lite-tv11.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/framextv-lite.apk downloads/framextv-lite-tv11.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish latest FrameXTV Lite APK [skip ci]"
            git push
          fi
