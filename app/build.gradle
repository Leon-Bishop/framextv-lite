plugins {
    id 'com.android.application'
}

android {
    namespace 'io.framextv.lite'
    compileSdk 35

    defaultConfig {
        applicationId 'io.framextv.lite'
        minSdk 21
        targetSdk 30
        versionCode 3
        versionName '1.2.0'
    }

    flavorDimensions += "device"

    productFlavors {
        standard {
            dimension "device"
        }
        tv11 {
            dimension "device"
            applicationIdSuffix ".tv11fixed"
            versionNameSuffix "-tv11-fixed"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

// Deliberately no third-party libraries: Android's native widgets and WebView only.
